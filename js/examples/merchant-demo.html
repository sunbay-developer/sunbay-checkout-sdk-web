<!doctype html>
<html lang="zh">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Sunbay Checkout SDK — 商户端到端 Demo</title>
        <!--
      ============================================================================
      端到端商户 Demo（模拟真实商户页面，独立 origin）
      ============================================================================

      完整演示商户接入流程：
        1) 本页由 demo server（node server.mjs，默认 :8080）托管 —— 模拟商户自己的
           站点，与 checkout 托管页（:3000）**跨域**；
        2) 点「① 创建订单并初始化」→ 调本站后端 POST /api/create-session，
           由服务端持商户密钥向 Sunbay 开放平台下单，返回 sessionId（密钥不下发浏览器）；
        3) 用 sessionId 调 SDK createCheckout（hostOrigin 指向 checkout:3000）；
        4) 挂载拆分卡字段（cardNumber / cardExpiry / cardCvc）与 expressCheckout
           （Apple / Google Pay 快捷支付按钮）；
        5) 点「② 支付」调 confirm 发起卡支付；express 按钮自身触发钱包支付。

      运行（三步，详见 README.md）：
        - 起 checkout：     cd ../../../checkout && npm run dev   # :3000
        - 构建 SDK 产物：   cd .. && npm run build                # 生成 dist/index.global.js
        - 起 demo server：  node server.mjs                       # :8080，然后打开 /merchant-demo.html

      安全验收：卡数据只存在于 checkout 托管 iframe 内；本页（父窗口）监听的事件
      （change / paymentResult 等）绝不含任何卡值（明文或密文）。
      ============================================================================
    -->
        <style>
            :root {
                color-scheme: light dark;
            }
            body {
                font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
                max-width: 560px;
                margin: 40px auto;
                padding: 0 16px;
                line-height: 1.5;
            }
            h1 {
                font-size: 20px;
            }
            label {
                display: block;
                font-size: 13px;
                font-weight: 600;
                margin: 16px 0 6px;
            }
            input[type='text'] {
                width: 100%;
                box-sizing: border-box;
                padding: 8px 10px;
                font-size: 14px;
                border: 1px solid #ccc;
                border-radius: 6px;
            }
            .field {
                min-height: 42px;
                border: 1px solid #ccc;
                border-radius: 6px;
                padding: 2px;
            }
            .row {
                display: flex;
                gap: 12px;
            }
            .row > div {
                flex: 1;
            }
            #express {
                margin-top: 8px;
                min-height: 10px;
            }
            button {
                margin-top: 20px;
                padding: 10px 16px;
                font-size: 15px;
                font-weight: 600;
                border: 0;
                border-radius: 6px;
                background: #2563eb;
                color: #fff;
                cursor: pointer;
            }
            button:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }
            #result {
                margin-top: 20px;
                padding: 12px;
                border-radius: 6px;
                background: #f3f4f6;
                white-space: pre-wrap;
                font-family: ui-monospace, monospace;
                font-size: 13px;
                min-height: 20px;
            }
            .hint {
                font-size: 12px;
                color: #6b7280;
            }
        </style>
    </head>
    <body>
        <h1>Sunbay Checkout SDK — 商户 Demo</h1>
        <p class="hint">
            本页模拟商户站点（由 demo server 托管，与 checkout 跨域）。session 由本站后端
            下单创建；卡字段与 express 托管在 checkout 的 iframe 内，父窗口只能收到公开事件，
            收不到任何卡值。
        </p>

        <label for="hostOrigin">Checkout 托管地址 (hostOrigin)</label>
        <input id="hostOrigin" type="text" value="http://localhost:3000" />

        <label for="sessionId">Session ID（留空则调用本站后端下单生成）</label>
        <input id="sessionId" type="text" placeholder="cs_xxx（直接填入已有会话）" />

        <label>Apple / Google Pay（快捷支付）</label>
        <div id="express"></div>

        <label>卡号 (cardNumber)</label>
        <div id="card-number" class="field"></div>

        <div class="row">
            <div>
                <label>有效期 (cardExpiry)</label>
                <div id="card-expiry" class="field"></div>
            </div>
            <div>
                <label>安全码 (cardCvc)</label>
                <div id="card-cvc" class="field"></div>
            </div>
        </div>

        <button id="init-btn" type="button">① 创建订单并初始化</button>
        <button id="pay-btn" type="button" disabled>② 支付 (confirm)</button>

        <label>结果 / 事件</label>
        <div id="result">点击「① 创建订单并初始化」开始。</div>

        <!-- 引入 checkout-sdk 的 IIFE 产物（暴露 window.SunbayCheckout）。 -->
        <script src="../dist/index.global.js"></script>
        <script>
            (function () {
                'use strict';

                const hostOriginInput = document.getElementById('hostOrigin');
                const sessionIdInput = document.getElementById('sessionId');
                const initBtn = document.getElementById('init-btn');
                const payBtn = document.getElementById('pay-btn');
                const resultEl = document.getElementById('result');

                /** 覆盖/追加展示信息到结果区。 */
                function show(msg, obj) {
                    resultEl.textContent =
                        obj !== undefined ? msg + '\n' + JSON.stringify(obj, null, 2) : msg;
                }

                /** 持有已就绪的 CheckoutInstance。 */
                let checkout = null;

                /**
                 * 调本站后端创建支付会话（服务端持密钥下单，返回 sessionId）。
                 * 演示商品固定一件，真实商户应传实际购物车。
                 */
                async function createSession() {
                    const res = await fetch('/api/create-session', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            items: [{ name: 'Demo Item', amount: 1000, num: 1 }],
                            description: 'Checkout SDK end-to-end demo',
                            returnUrl: window.location.origin + '/merchant-demo.html',
                        }),
                    });
                    const data = await res.json();
                    if (!res.ok || !data.sessionId) {
                        throw new Error(data.error || '创建会话失败');
                    }
                    return data.sessionId;
                }

                // ① 创建订单 → createCheckout → 挂载卡字段 + express。
                initBtn.addEventListener('click', async function () {
                    if (!window.SunbayCheckout || !window.SunbayCheckout.createCheckout) {
                        show('未加载到 SunbayCheckout，请先在 js 下执行 npm run build 生成 dist/index.global.js。');
                        return;
                    }
                    initBtn.disabled = true;
                    show('① 正在准备会话…');

                    try {
                        // 优先使用手填的 sessionId；留空则调用本站后端下单生成。
                        const typedSessionId = (sessionIdInput.value || '').trim();
                        const sessionId = typedSessionId || (await createSession());
                        show(
                            (typedSessionId ? '使用已有会话' : '会话已创建') +
                                '，正在握手并初始化托管运行时…\nsessionId=' +
                                sessionId
                        );

                        checkout = await window.SunbayCheckout.createCheckout({
                            sessionId: sessionId,
                            env: 'dev',
                            hostOrigin: hostOriginInput.value.trim() || 'http://localhost:3000',
                        });

                        // 订阅支付终态与错误（父窗口只拿 outcome，绝无卡值）。
                        checkout.on('paymentResult', function (evt) {
                            show('收到 paymentResult 事件：', evt);
                        });
                        checkout.on('error', function (evt) {
                            show('收到 error 事件：', evt);
                        });

                        // 快捷支付（Apple / Google Pay）：钱包按钮由 express Element 自渲染，
                        // 可用性取决于会话允许 ∩ 浏览器环境（需 Safari+Apple 设备 / Chrome+GPay）。
                        const express = checkout.create('expressCheckout');
                        express.on('availablePaymentMethodsChange', function (evt) {
                            show('express 可用钱包变化：', evt);
                        });

                        // 挂载：express + 三个拆分卡字段。
                        await express.mount('#express');
                        await checkout.create('cardNumber').mount('#card-number');
                        await checkout.create('cardExpiry').mount('#card-expiry');
                        await checkout.create('cardCvc').mount('#card-cvc');

                        payBtn.disabled = false;
                        show('初始化完成，卡字段与 express 已挂载。填写卡信息后点「② 支付」，或直接点 Apple/Google Pay 按钮。');
                    } catch (err) {
                        initBtn.disabled = false;
                        show('初始化失败：', serializeErr(err));
                    }
                });

                // ② 卡支付：confirm，Promise 由同 operationId 的 paymentResult 兑现。
                payBtn.addEventListener('click', async function () {
                    if (!checkout) {
                        show('尚未初始化。');
                        return;
                    }
                    payBtn.disabled = true;
                    show('已发起支付确认，等待结果…');
                    try {
                        const outcome = await checkout.confirm();
                        show('confirm 返回的 PaymentOutcome：', outcome);
                    } catch (err) {
                        show('支付失败：', serializeErr(err));
                    } finally {
                        payBtn.disabled = false;
                    }
                });

                /** 把错误（Error 或 CheckoutError 结构）转为可读对象。 */
                function serializeErr(err) {
                    if (err && typeof err === 'object') {
                        if (err instanceof Error) return { message: err.message };
                        return err;
                    }
                    return { message: String(err) };
                }
            })();
        </script>
    </body>
</html>
