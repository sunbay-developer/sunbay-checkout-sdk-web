<!doctype html>
<html lang="zh">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Sunbay Checkout SDK — 主题 / colorScheme Demo</title>
        <!--
      ============================================================================
      colorScheme（深浅色）Demo —— 演示 appearance.colorScheme 的初始化与运行时切换
      ============================================================================

      SDK iframe（Element）的配色由商户外部控制，**默认浅色**，三态：
        - 'light' / 'dark'：强制定值，忽略系统偏好；
        - 'auto'：跟随系统 prefers-color-scheme。

      本 Demo 演示两条路径：
        1) 初始化：在 createCheckout 的 appearance.colorScheme 指定初始配色，
           iframe 在 SSR 首帧即为该配色（无闪烁、不跟随系统，除非选 auto）；
        2) 运行时切换：调 checkout.updateCheckout({ appearance: { colorScheme } })，
           main 经同源点对点 port 下发给各 Element iframe，字段配色实时切换。

      运行（三步，详见 README.md）：
        - 起 checkout：     cd ../../../checkout && npm run dev   # :3000
        - 构建 SDK 产物：   cd .. && npm run build                # 生成 dist/index.global.js
        - 起 demo server：  node server.mjs                       # :8080，打开 /theme-demo.html

      安全验收：卡数据只存在于 checkout 托管 iframe 内；父窗口切换配色只发送
      appearance 补丁，绝不涉及任何卡值。
      ============================================================================
    -->
        <style>
            :root {
                color-scheme: light dark;
            }
            body {
                font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
                max-width: 560px;
                margin: 40px auto;
                padding: 0 16px;
                line-height: 1.5;
            }
            h1 {
                font-size: 20px;
            }
            label {
                display: block;
                font-size: 13px;
                font-weight: 600;
                margin: 16px 0 6px;
            }
            input[type='text'] {
                width: 100%;
                box-sizing: border-box;
                padding: 8px 10px;
                font-size: 14px;
                border: 1px solid #ccc;
                border-radius: 6px;
            }
            select {
                padding: 8px 10px;
                font-size: 14px;
                border: 1px solid #ccc;
                border-radius: 6px;
            }
            .field {
                min-height: 42px;
                border: 1px solid #ccc;
                border-radius: 6px;
                padding: 2px;
            }
            .row {
                display: flex;
                gap: 12px;
            }
            .row > div {
                flex: 1;
            }
            .switcher {
                margin-top: 20px;
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
            }
            button {
                margin-top: 20px;
                padding: 10px 16px;
                font-size: 15px;
                font-weight: 600;
                border: 0;
                border-radius: 6px;
                background: #2563eb;
                color: #fff;
                cursor: pointer;
            }
            .switcher button {
                margin-top: 0;
                background: #475569;
            }
            button:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }
            #result {
                margin-top: 20px;
                padding: 12px;
                border-radius: 6px;
                background: #f3f4f6;
                white-space: pre-wrap;
                font-family: ui-monospace, monospace;
                font-size: 13px;
                min-height: 20px;
            }
            .hint {
                font-size: 12px;
                color: #6b7280;
            }
        </style>
    </head>
    <body>
        <h1>Sunbay Checkout SDK — 主题 / colorScheme Demo</h1>
        <p class="hint">
            SDK iframe 的配色由商户控制，默认浅色。下方「初始配色」在初始化时随 createCheckout
            的 appearance.colorScheme 传入；初始化后用「运行时切换」按钮调 updateCheckout
            动态切换，观察卡字段配色实时变化（卡值始终只在 iframe 内，父窗口只发配色补丁）。
        </p>

        <label for="hostOrigin">Checkout 托管地址 (hostOrigin)</label>
        <input id="hostOrigin" type="text" value="http://localhost:3000" />

        <label for="sessionId">Session ID（留空则调用本站后端下单生成）</label>
        <input id="sessionId" type="text" placeholder="cs_xxx（直接填入已有会话）" />

        <label for="initScheme">初始配色 (appearance.colorScheme)</label>
        <select id="initScheme">
            <option value="light">light（默认，强制浅色）</option>
            <option value="dark">dark（强制深色）</option>
            <option value="auto">auto（跟随系统）</option>
        </select>

        <label>卡号 (cardNumber)</label>
        <div id="card-number" class="field"></div>

        <div class="row">
            <div>
                <label>有效期 (cardExpiry)</label>
                <div id="card-expiry" class="field"></div>
            </div>
            <div>
                <label>安全码 (cardCvc)</label>
                <div id="card-cvc" class="field"></div>
            </div>
        </div>

        <button id="init-btn" type="button">① 创建订单并初始化</button>

        <label>运行时切换配色 (updateCheckout)</label>
        <div class="switcher">
            <button type="button" class="scheme-btn" data-scheme="light" disabled>light</button>
            <button type="button" class="scheme-btn" data-scheme="dark" disabled>dark</button>
            <button type="button" class="scheme-btn" data-scheme="auto" disabled>auto</button>
        </div>

        <label>结果 / 事件</label>
        <div id="result">点击「① 创建订单并初始化」开始。</div>

        <!-- 引入 checkout-sdk 的 IIFE 产物（暴露 window.SunbayCheckout）。 -->
        <script src="../dist/index.global.js"></script>
        <script>
            (function () {
                'use strict';

                const hostOriginInput = document.getElementById('hostOrigin');
                const sessionIdInput = document.getElementById('sessionId');
                const initSchemeSelect = document.getElementById('initScheme');
                const initBtn = document.getElementById('init-btn');
                const schemeBtns = Array.prototype.slice.call(
                    document.querySelectorAll('.scheme-btn')
                );
                const resultEl = document.getElementById('result');

                /** 覆盖/追加展示信息到结果区。 */
                function show(msg, obj) {
                    resultEl.textContent =
                        obj !== undefined ? msg + '\n' + JSON.stringify(obj, null, 2) : msg;
                }

                /** 启用/禁用运行时切换按钮组。 */
                function setSwitcherEnabled(enabled) {
                    schemeBtns.forEach(function (b) {
                        b.disabled = !enabled;
                    });
                }

                /** 持有已就绪的 CheckoutInstance。 */
                let checkout = null;

                /**
                 * 调本站后端创建支付会话（服务端持密钥下单，返回 sessionId）。
                 */
                async function createSession() {
                    const res = await fetch('/api/create-session', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            items: [{ name: 'Theme Demo Item', amount: 1000, num: 1 }],
                            description: 'Checkout SDK colorScheme demo',
                            returnUrl: window.location.origin + '/theme-demo.html',
                        }),
                    });
                    const data = await res.json();
                    if (!res.ok || !data.sessionId) {
                        throw new Error(data.error || '创建会话失败');
                    }
                    return data.sessionId;
                }

                // ① 创建订单 → createCheckout（带初始 colorScheme）→ 挂载卡字段。
                initBtn.addEventListener('click', async function () {
                    if (!window.SunbayCheckout || !window.SunbayCheckout.createCheckout) {
                        show('未加载到 SunbayCheckout，请先在 js 下执行 npm run build 生成 dist/index.global.js。');
                        return;
                    }
                    initBtn.disabled = true;
                    const initScheme = initSchemeSelect.value;
                    show('① 正在准备会话…（初始配色=' + initScheme + '）');

                    try {
                        const typedSessionId = (sessionIdInput.value || '').trim();
                        const sessionId = typedSessionId || (await createSession());
                        show(
                            (typedSessionId ? '使用已有会话' : '会话已创建') +
                                '，正在握手并初始化托管运行时…\nsessionId=' +
                                sessionId +
                                '\n初始 colorScheme=' +
                                initScheme
                        );

                        checkout = await window.SunbayCheckout.createCheckout({
                            sessionId: sessionId,
                            env: 'dev',
                            hostOrigin: hostOriginInput.value.trim() || 'http://localhost:3000',
                            // 初始配色在此传入；iframe SSR 首帧即为该配色。
                            appearance: { colorScheme: initScheme },
                        });

                        checkout.on('error', function (evt) {
                            show('收到 error 事件：', evt);
                        });

                        // 挂载三个拆分卡字段（配色随主题变化，便于直观观察切换）。
                        await checkout.create('cardNumber').mount('#card-number');
                        await checkout.create('cardExpiry').mount('#card-expiry');
                        await checkout.create('cardCvc').mount('#card-cvc');

                        setSwitcherEnabled(true);
                        show(
                            '初始化完成（初始配色=' +
                                initScheme +
                                '）。点下方 light / dark / auto 按钮即可运行时切换，观察卡字段配色变化。'
                        );
                    } catch (err) {
                        initBtn.disabled = false;
                        show('初始化失败：', serializeErr(err));
                    }
                });

                // 运行时切换：updateCheckout 下发 appearance.colorScheme 补丁。
                schemeBtns.forEach(function (btn) {
                    btn.addEventListener('click', async function () {
                        if (!checkout) {
                            show('尚未初始化。');
                            return;
                        }
                        const scheme = btn.getAttribute('data-scheme');
                        setSwitcherEnabled(false);
                        show('运行时切换配色 → ' + scheme + '（updateCheckout）…');
                        try {
                            await checkout.updateCheckout({
                                appearance: { colorScheme: scheme },
                            });
                            show('已切换为 colorScheme=' + scheme + '，观察卡字段配色是否随之变化。');
                        } catch (err) {
                            show('切换失败：', serializeErr(err));
                        } finally {
                            setSwitcherEnabled(true);
                        }
                    });
                });

                /** 把错误（Error 或 CheckoutError 结构）转为可读对象。 */
                function serializeErr(err) {
                    if (err && typeof err === 'object') {
                        if (err instanceof Error) return { message: err.message };
                        return err;
                    }
                    return { message: String(err) };
                }
            })();
        </script>
    </body>
</html>
